plugins {
    id "com.android.application"
}

android {
    namespace "com.gitmartini.neoncoredefense"
    compileSdk 35

    defaultConfig {
        applicationId "com.gitmartini.neoncoredefense"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    applicationVariants.configureEach { variant ->
        outputs.configureEach {
            outputFileName = "neoncore-${variant.name}.apk"
        }
    }
}
